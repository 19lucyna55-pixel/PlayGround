<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Nightfall Survivors</title>
  <style>
    :html,body{height:100%;overflow:hidden}*{box-sizing:border-box}body{margin:0;background:#090b12;color:#eff5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));display:flex;gap:12px;align-items:center}.timer{font-size:18px;font-weight:900;text-align:center;width:72px;text-shadow:0 2px 8px #000}.bar{height:12px;border:2px solid #e9efff;border-radius:20px;background:#1b1d27;box-shadow:0 2px 10px #000;overflow:hidden}.hp{flex:1}.xp{position:absolute;top:-12px;left:0;width:100%;height:7px;border-width:1px}.hpfill,.xpfill{height:100%;transition:width .12s}.hpfill{background:linear-gradient(90deg,#bc2a39,#f05a68)}.xpfill{background:linear-gradient(90deg,#4c6cff,#83a5ff)}.stats{position:absolute;left:18px;bottom:18px;font-size:13px;font-weight:800;color:#dfe5f5;text-shadow:0 2px 6px #000}.bossbar{position:absolute;top:54px;left:50%;transform:translateX(-50%);width:min(620px,70vw);height:14px;border:2px solid #dcc8ff;border-radius:8px;background:#17101f;display:none}.bossfill{height:100%;background:linear-gradient(90deg,#6d2eb2,#ca62df);width:100%}.levelup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,13,.72);pointer-events:auto}.levelup.show{display:flex}.cards{display:flex;gap:14px;width:min(820px,calc(100vw - 30px));justify-content:center}.card{width:240px;min-height:245px;border:2px solid #7986a7;border-radius:12px;background:linear-gradient(145deg,#25293a,#151823);padding:18px;text-align:center;cursor:pointer;box-shadow:0 12px 30px #0008;transition:.15s}.card:hover{transform:translateY(-6px);border-color:#aabaff}.icon{width:78px;height:78px;margin:8px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:#32384c;border:2px solid #63708d}.card h3{margin:8px 0}.card p{font-size:13px;color:#bdc5d8;line-height:1.35}.gameover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,13,.82);pointer-events:auto}.gameover.show{display:flex}.panel{text-align:center}.panel h1{font-size:52px;margin:0 0 8px}.panel button{border:2px solid #b0bbda;background:#2c3245;color:white;border-radius:8px;padding:12px 24px;font-weight:900;cursor:pointer;font-size:16px}.joystick{position:absolute;left:24px;bottom:24px;width:112px;height:112px;border:2px solid rgba(255,255,255,.15);border-radius:50%;display:none;pointer-events:auto;background:rgba(255,255,255,.05)}.stick{position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.3)}@media(pointer:coarse){.joystick{display:block}.stats{left:150px}}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
  <div class="top"><div class="bar hp"><div class="hpfill" id="hp"></div></div><div class="timer" id="time">05:00</div><div class="bar hp"></div><div class="bar xp" id="xpbar"><div class="xpfill" id="xp"></div></div></div>
  <div class="bossbar" id="boss"><div class="bossfill" id="bossfill"></div></div>
  <div class="stats" id="stats"></div>
  <div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
  <div class="levelup" id="levelup"><div class="cards" id="cards"></div></div>
  <div class="gameover" id="gameover"><div class="panel"><h1 id="endtitle">Fallen</h1><p id="endreason"></p><button id="restart">RISE AGAIN</button></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR,keys={},touch={x:0,y:0,active:false},paused=false,ended=false,game;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function init(){game={t:0,level:1,xp:0,xpNeed:12,spawn:0,enemyCount:0,player:{x:0,y:0,r:11,hp:100,maxHp:100,speed:170,dir:0,inv:0,orbit:0,orbitCd:0,orbitN:1,magic:1,projectileCd:.25,damage:24,pierce:1,regen:0},enemies:[],bolts:[],orbs:[],particles:[],boss:null,slashes:[]};paused=false;ended=false;document.getElementById('gameover').className='gameover';document.getElementById('levelup').className='levelup'}init();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerely]='x');
function keyup(e){keys[e.key.toLowerCase()]=false}addEventListener('keyup',keyup);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);touch.active=true;moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});function endJoy(){joyId=null;touch.active=false;touch.x=touch.y=0;stick.style.transform=''}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=joy.getBoundingRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;let d=Math.hypot(dx,dy),m=36;if(d>m){dx=dx/d*m;dy=dy/d*m}touch.x=dx/m;touch.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}
function spawnEnemy(){const p=game.player,a=rand(0,Math.PI*2),d=rand(Math.max(W,H)*.55,Math.max(W,H)*.75),bossTime=game.t>120&&game.t<122&&game.bossTime!==1;if(bossTime){game.bossTime=1;spawnBoss();return}let elite=game.t>30&&Math.random()<.035;const e={x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:elite?18:rand(8,13),hp:elite?120+game.t*.8:18+game.t*.22,speed:elite?36:rand(42,68)+game.t*.11,elite,hit:0,seed:rand(0,99)};game.enemies.push(e)}
function spawnBoss(){const p=game.player,a=rand(0,Math.PI*2),d=Math.max(W,H)*.55,b={x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:28,hp:850+game.t*8,maxHp:850+game.t*8,speed:38,hit:0,boss:true};game.boss=b;game.enemies.push(b);document.getElementById('boss').style.display='block'}
function spawnOrb(e){game.orbs.push({x:e.x,y:e.y,r:4,value:e.boss?12:4+Math.floor(rand(0,2))})}
function update(dt){if(paused||ended)return;game.t+=dt;const p=game.player;p.inv=Math.max(0,p.inv-dt);p.orbitCd-=dt;
 let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touch.x,my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touch.y;let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}if(l>.05)p.dir=Math.atan2(my,mx);p.x+=mx*p.speed*dt;p.y+=my*p.speed*dt;
 p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);game.spawn-=dt;if(game.spawn<=0){game.spawn=Math.max(.18,.75-game.t*.005);spawnEnemy()}
 p.projectileCd-=dt;if(p.projectileCd<=0&&game.enemies.length){p.projectileCd=.42/p.magic;let target=null,bd=1e9;for(const e of game.enemies){let d=dist(p,e);if(d<bd){bd=d;target=e}}if(target){let a=Math.atan2(target.y-p.y,target.x-p.x);for(let i=0;i<p.magic;i++){let spread=(i-(p.magic-1)/2)*.13;game.bolts.push({x:p.x,y:p.y,vx:Math.cos(a+spread)*310,vy:Math.sin(a+spread)*310,r:5,life:2.2,damage:p.damage,pierce:p.pierce,hit:new Set()})}}}
 if(p.orbitN&&p.orbitCd<=0){p.orbitCd=.5;for(let i=0;i<p.orbitN;i++){let a=game.t*1.8+i*Math.PI*2/p.orbitN;game.slashes.push({x:p.x+Math.cos(a)*58,y:p.y+Math.sin(a)*58,r:20,life:.12,damage:p.damage*.7})}}
 for(let i=game.bolts.length-1;i>=0;i--){let b=game.bolts[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0){game.bolts.splice(i,1);continue}}
 for(let i=game.orbs.length-1;i>=0;i--){let o=game.orbs[i],d=dist(p,o);if(d<150){let a=Math.atan2(p.y-o.y,p.x-o.x);o.x+=Math.cos(a)*(260-d*.7)*dt;o.y+=Math.sin(a)*(260-d*.7)*dt}if(dist(p,o)<p.r+o.r){game.xp+=o.value;game.orbs.splice(i,1);if(game.xp>=game.xpNeed)levelUp()}}
 for(let i=game.slashes.length-1;i>=0;i--) {let s=game.slashes[i];s.life-=dt;if(s.life<=0)game.slashes.splice(i,1)}
 for(let i=game.enemies.length-1;i>=0;i--){let e=game.enemies[i];e.hit-=dt;let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(dist(p,e)<p.r+e.r&&p.inv<=0){p.hp-=e.boss?18:9;p.inv=.65;if(p.hp<=0){end(false);return}}}
 for(const b of game.bolts){for(let i=game.enemies.length-1;i>=0;i--){let e=game.enemies[i];if(!b.hit.has(e)&&dist(b,e)<b.r+e.r){b.hit.add(e);e.hp-=b.damage;e.hit=.12;if(e.hp<=0){if(e.boss){document.getElementById('boss').style.display='none';game.boss=null}spawnOrb(e);game.enemies.splice(i,1)}if(b.hit.size>=b.pierce){b.life=0}}}}
 for(const s of game.slashes)for(let i=game.enemies.length-1;i>=0;i--){let e=game.enemies[i];if(dist(s,e)<s.r+e.r){e.hp-=s.damage;e.hit=.08;if(e.hp<=0){if(e.boss){document.getElementById('boss').style.display='none';game.boss=null}spawnOrb(e);game.enemies.splice(i,1)}}}
 document.getElementById('hp').style.width=(p.hp/p.maxHp*100)+'%';document.getElementById('xp').style.width=(game.xp/game.xpNeed*100)+'%';document.getElementById('time').textContent=format(Math.max(0,300-game.t));document.getElementById('stats').innerHTML=`LV ${game.level}&nbsp;&nbsp; KILLS ${game.kills||0}&nbsp;&nbsp; DMG ${p.damage}`;if(game.boss)document.getElementById('bossfill').style.width=(game.boss.hp/game.boss.maxHp*100)+'%';if(game.t>=300)end(true);
}
function format(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
const upgrades=[{icon:'✦',name:'Arcane Bolt',text:'Fire an additional magic projectile.',apply:p=>p.magic++},{icon:'♨',name:'Blood Power',text:'Increase projectile damage.',apply:p=>p.damage+=10},{icon:'◉',name:'Twin Orbit',text:'Gain another orbiting blade.',apply:p=>p.orbitN++},{icon:'♥',name:'Vitality',text:'Restore 20 health and increase max health.',apply:p=>{p.maxHp+=20;p.hp+=20}},{icon:'➤',name:'Swift Step',text:'Move 12% faster.',apply:p=>p.speed*=1.12},{icon:'➰',name:'Piercing',text:'Bolts pierce one additional enemy.',apply:p=>p.pierce++},{icon:'✚',name:'Regeneration',text:'Recover 1 health each second.',apply:p=>p.regen+=1},{icon:'⚡',name:'Haste',text:'Cast projectiles much faster.',apply:p=>p.projectileCd=Math.min(p.projectileCd,.12)}];
function levelUp(){game.level++;game.xp-=game.xpNeed;game.xpNeed=Math.floor(game.xpNeed*1.28);paused=true;let pool=[...upgrades].sort(()=>Math.random-.5).slice(0,3),cards=document.getElementById('cards');cards.innerHTML='';pool.forEach(u=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="icon">${u.icon}</div><h3>${u.name}</h3><p>${u.text}</p>`;c.onclick=()=>{u.apply(game.player);paused=false;document.getElementById('levelup').className='levelup'};cards.appendChild(c)});document.getElementById('levelup').className='levelup show'}
function end(win){ended=true;document.getElementById('endtitle').textContent=win?'DAWN BREAKS':'Fallen';document.getElementById('endreason').textContent=win?'You survived the night.':'The darkness consumed you.';document.getElementById('gameover').className='gameover show'}document.getElementById('restart').onclick=()=>init();
function draw(){ctx.clearRect(0,0,W,H);const p=game.player,cx=W/2-canvasPos(p.x),cy=H/2-canvasPos(p.y);ctx.save();ctx.translate(W/2-p.x,H/2-p.y);drawGround();for(const o of game.orbs){ctx.fillStyle='#63d6ff';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=10;ctx.shadowColor='#63d6ff';ctx.fill()}ctx.shadowBlur=0;for(const b of game.bolts){ctx.fillStyle='#9ae9ff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d7f8ff';ctx.beginPath();ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x,b.y);ctx.stroke()}for(const s of game.slashes){ctx.strokeStyle='#c7a7ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.stroke()}for(const e of game.enemies){if(e.boss)drawBoss(e);else{ctx.fillStyle=e.hit>0?'#d7edf4':(e.elite?'#9f4aa3':'#9d1e22');ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#16131a';ctx.beginPath();ctx.arc(e.x-4,e.y-3,2,0,Math.PI*2);ctx.arc(e.x+4,e.y-3,2,0,Math.PI*2);ctx.fill();if(e.elite){ctx.strokeStyle='#e0a2e7';ctx.lineWidth=2;ctx.stroke()}}}drawPlayer(p);ctx.restore();requestAnimationFrame(loop)}
function canvasPos(v){return v}function drawGround(){ctx.fillStyle='#11151f';ctx.fillRect(px(-5000),py(-5000),10000,10000);ctx.fillStyle='rgba(126,133,165,.025)';const gs=64,startX=Math.floor((game.player.x-W/2)/gs)*gs,startY=Math.floor((game.player.y-H/2)/gs)*gs;for(let x=startX;x<startX+W+gs;x+=gs)for(let y=startY;y<H+game.player.y+gs;y+=gs){if((Math.floor(x/gs)+Math.floor(y/gs))%2===0)ctx.fillRect(x,y,gs,gs)}ctx.strokeStyle='rgba(120,130,160,.07)';ctx.lineWidth=1;for(let x=startX;x<startX+W+gs;x+=gs){ctx.beginPath();ctx.moveTo(x,game.player.y-H/2);ctx.lineTo(x,game.player.y+H/2);ctx.stroke()}for(let y=startY;y<startY+H+gs;y+=gs){ctx.beginPath();ctx.moveTo(game.player.x-W/2,y);ctx.lineTo(game.player.x+W/2,y);ctx.stroke()}}
function px(x){return x}function py(y){return y}
function drawPlayer(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.dir);ctx.fillStyle=p.inv>0?'#b6b0cc':'#dce4f1';ctx.beginPath();ctx.ellipse(0,0,p.r*1.12,p.r*.86,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3d4354';ctx.beginPath();ctx.moveTo(-8,-9);ctx.lineTo(0,-18);ctx.lineTo(9,-9);ctx.closePath();ctx.fill();ctx.fillStyle='#ffcf68';ctx.beginPath();ctx.arc(5,-2,2.2,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBoss(e){ctx.fillStyle=e.hit>0?'#e3d5ec':'#28203a';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9b78c2';ctx.beginPath();ctx.moveTo(e.x-22,e.y-14);ctx.lineTo(e.x-34,e.y-32);ctx.lineTo(e.x-8,e.y-25);ctx.moveTo(e.x+22,e.y-14);ctx.lineTo(e.x+34,e.y-32);ctx.lineTo(e.x+8,e.y-25);ctx.fill();ctx.fillStyle='#d7aaff';ctx.beginPath();ctx.arc(e.x-9,e.y-4,3,0,Math.PI*2);ctx.arc(e.x+9,e.y-4,3,0,Math.PI*2);ctx.fill()}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw()}
requestAnimationFrame(loop);
</script>
</body>
</html>
